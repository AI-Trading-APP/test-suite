[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=test_report.html
    --self-contained-html
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    journey_browse: Browse & Discover trader journey (T1-T9)
    journey_watchlist: Watchlist Management trader journey (T10-T19)
    journey_analysis: Deep Analysis trader journey (T20-T26)
    journey_trading: Portfolio & Paper Trading trader journey (T27-T33)
    journey_health: Service Health & Integration (T34-T41)

